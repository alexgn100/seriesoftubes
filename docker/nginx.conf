server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    location / {
        try_files $uri $uri/ =404;
    }

    # A types{} block here would replace all of mime.types, so set just this one.
    location ~ \.webmanifest$ { default_type application/manifest+json; }

    # The page, the service worker and version.json must never be cached, or
    # players would miss new releases; everything else is versioned or static.
    location = /index.html   { add_header Cache-Control "no-cache"; }
    location = /sw.js        { add_header Cache-Control "no-cache"; }
    location = /version.json { add_header Cache-Control "no-cache"; }
}
